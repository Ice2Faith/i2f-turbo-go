goboot:
  application:
    name: go-server
  profiles:
    active: dev
  server:
    port: 8080
    bannerPath: ./banner.txt
    staticResources:
      enable: true
      disablePreCompressGzipHandler: false
      disableIndexHtmlRedirect: false
      preCompressGzip:
        enable: false
        options:
          minByteSize: 256
          removeIfLarger: true
          forceCover: true
          suffixes: []
      items:
        - urlPath: /web
          filePath: ./web/
          tryFiles: index.htm index.html
        - urlPath: /app
          filePath: ./app/
          tryFiles: index.htm index.html
    templateResources:
      enable: false
      filePath: ./templates/**/*.html
    session:
      enable: false
      # cookie/redis
      impl: cookie
      secretKey: ${goboot.session.secret-key:123456}
      sessionKey: go-session
    redis:
      enable: false
      host: 127.0.0.1
      port: 6379
      password: ${goboot.redis.password:123456}
      database: 0
    datasource:
      enable: false
      # mysql/postgres
      driver: mysql
      host: 127.0.0.1
      port: 6379
      # url: user:password@tcp(localhost:5555)/dbname?tls=skip-verify&autocommit=true
      url: root:123456@tcp(127.0.0.1:3306)/test_db?charset=utf8mb4&parseTime=True&loc=Local
      username: root
      password: ${goboot.datasource.password:123456}
      database: test_db
    gorm:
      enable: false
    https:
      enable: false
      pemPath: ./https/server.pem
      keyPath: ./https/server.key
    gzip:
      enable: false
      # BestCompression/BestSpeed/DefaultCompression/NoCompression
      level: DefaultCompression
      excludeExtensions:
        - .mp4
        - .mp3
        - .m3u8
        - .xlsx
        - .xls
      excludePaths:
        - /api/
      excludePathRegexes:
        - ".*download"
    proxy:
      enable: false
      items:
        - name: baidu
          path: /proxy/baidu/
          redirect: https://www.baidu.com/
        - name: bilibili
          path: /proxy/bilibili/
          redirect: https://www.bilibili.com/
        - name: upstream
          path: /proxy/api/
          # 多台主机，可以使用负载均衡策略配置 upstream
          upstream:
            # 开启 upstream
            enable: true
            # 算法：ip_hash,random,round,weight,header_hash,path_hash
            algo: random
            # 如果算法是 header_hash 的时候，需要添加请求头列表
            headers:
              - Authorization
            backends:
              - backend: https://10.1.x.101:8080/
                # 权重，当算法为weight时生效
                weight: 3
              - backend: https://10.1.x.102:8080/
                weight: 2
              - backend: https://10.1.x.103:8080/
                weight: 1
    mapping:
      enable: false
      items:
        - /api/
    rateLimit:
      enable: false
      countPerSecond: 30
      bucketSize: 100
    fileServer:
      enable: false
      rootPath: ./file-server
      urlPath: /file-server
      disableUpload: true
      disableDownload: false
      disableList: false
      disableBrowser: false
      disableOffice: false
      disableOfficeCom: false
    cors:
      enable: true
      allowAllOrigins: true
      allowOrigins:
        - http://localhost/
      allowMethods:
        - GET
        - PUT
        - DELETE
        - POST
        - PATCH
        - OPTIONS
      allowHeaders:
        - token
        - Origin
        - secure
        - Auth
      exposeHeaders:
        - Content-Length
      allowCredentials: true
      maxAgeMinutes: 0

